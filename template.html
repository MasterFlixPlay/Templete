<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="{{bg_color}}" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="{{app_name}}" />
<link rel="apple-touch-icon" href="https://i.ibb.co/7t6BpWkN/Canais.png" />
<title>{{app_name}} — Player</title>
<link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"{{app_name}}","short_name":"App","start_url":".","display":"standalone","background_color":"{{bg_color}}","theme_color":"{{primary_color}}"}' />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video-js.min.css" />
<script src="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
/* =========================================
   BASE DO SISTEMA (Nunca muda)
   ========================================= */
:root{
  --pink-neon: {{primary_color}};
  --bg-app: {{bg_color}};
  --glass: rgba(255,255,255,.06);
  --glass-strong: rgba(255,255,255,.10);
  --glass-border: rgba(255,255,255,.10);
  --shadow-neon: 0 0 20px rgba({{primary_color_rgb}}, .4);
  --radius: 16px;
  --txt: #fff;
  --txt-muted: rgba(255,255,255,.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{ margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--txt); background:var(--bg-app); background-attachment:fixed; padding-bottom:env(safe-area-inset-bottom); min-height:100vh; }

.app-shell{position:relative;z-index:1;min-height:100vh}

/* LOGIN - PADRÃO */
.login-page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.2rem; background: var(--bg-app); }
.login-card{width:100%;max-width:420px;padding:2rem;border-radius:24px; background:var(--glass); border:1px solid var(--glass-border);}
.login-brand{text-align:center;margin-bottom:1.4rem}
.login-brand .brand-title{font-size:2.5rem;font-weight:800;color:var(--pink-neon);}
.field{position:relative;margin-bottom:.85rem}
.field .form-control{ background:rgba(0,0,0,.4);border:1px solid var(--glass-border);color:#fff; border-radius:14px;padding:.95rem 1rem; transition:all .2s; }
.field .form-control:focus{background:rgba(0,0,0,.6);border-color:var(--pink-neon);color:#fff}
.btn-neon{ background:linear-gradient(135deg,var(--pink-neon),#c41e7a); color:#fff;border:none;border-radius:999px;font-weight:700; padding:.85rem 1.4rem; box-shadow:var(--shadow-neon); width:100%; }

/* HEADER PADRÃO */
.app-header{ display:flex; align-items:center; justify-content:space-between; padding:1rem; background:rgba(0,0,0,.6); backdrop-filter:blur(10px); z-index:50; }
.app-header .app-title{font-weight:800;font-size:1.4rem;color:var(--pink-neon);}

/* NAVEGAÇÃO PADRÃO */
.bottom-nav{ position:fixed;bottom:0;width:100%;z-index:60; display:grid; grid-template-columns:repeat(5,1fr); background:rgba(0,0,0,.8);backdrop-filter:blur(20px); border-top:1px solid var(--glass-border); padding:.4rem 0; }
.bottom-nav .nav-item{ background:none;border:none;color:rgba(255,255,255,.55); display:flex;flex-direction:column;align-items:center;gap:.15rem; font-size:.7rem;font-weight:600; }
.bottom-nav .nav-item i{font-size:1.4rem}
.bottom-nav .nav-item.active{color:var(--pink-neon);}
.page{padding:1rem 1rem 100px; animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* === MECÂNICA DE CARREGAMENTO DE CONTEÚDO (Não mexa) === */
.h-scroll{display:flex;gap:.7rem;overflow-x:auto;padding-bottom:.4rem;}.h-scroll::-webkit-scrollbar{display:none}
.poster{ width:130px;border-radius:14px;overflow:hidden; background:var(--glass);border:1px solid var(--glass-border); cursor:pointer; }
.poster .ratio{aspect-ratio:2/3;background:rgba(255,255,255,.05);}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .meta{padding:.5rem .55rem}.poster .meta .t{font-size:.8rem;font-weight:600;line-height:1.2}
.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.7rem}
.ch-row{ display:flex;align-items:center;gap:.85rem;padding:.7rem .85rem;border-radius:16px; background:var(--glass);border:1px solid var(--glass-border);margin-bottom:.55rem;cursor:pointer; }
.ch-logo{ width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.06); display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0; }
.ch-logo img{max-width:80%;max-height:80%;object-fit:contain}
.ch-info{flex:1}.ch-info .n{font-weight:600;font-size:.9rem}
.ch-actions{display:flex;align-items:center;gap:.25rem}

.player-wrap{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 0 40px rgba(255,45,146,.35)}
.player-wrap video{width:100%;height:100%;display:block;background:#000}
.video-js{width:100%;height:100%;font-family:inherit;background:#000;color:#fff}
.video-js .vjs-big-play-button{background:var(--pink-neon);border:none;border-radius:50%;width:66px;height:66px;line-height:66px;margin-left:-33px;margin-top:-33px}
.video-js .vjs-play-progress,.video-js .vjs-volume-level{background:var(--pink-neon)}
.modal-content.glass-modal{ background:rgba(0,0,0,.9);border:1px solid var(--glass-border); border-radius:22px;color:#fff; }
.modal-content.glass-modal .btn-close{filter:invert(1) brightness(1.5)}
#playerModal .modal-dialog{max-width:980px}

/* =========================================
   DESIGN TEMPLATES (O que você vai escolher)
   ========================================= */

/* === MODELO 1: CLÁSSICO ROXO/NEON === */
{{MODELO_1_START}}
.hero-clássico{ width:100%; aspect-ratio:16/9; border-radius:var(--radius); background:linear-gradient(135deg, #200033, #0d001a); margin-bottom:1.5rem; display:flex; flex-direction:column; justify-content:flex-end; padding:1.5rem; box-shadow:var(--shadow-neon); position:relative; overflow:hidden; }
.hero-clássico h2{font-size:1.8rem;font-weight:800;text-shadow:0 4px 12px rgba(0,0,0,.7);margin:0}
.hero-clássico .glow{ position:absolute; width:300px; height:300px; border-radius:50%; background:var(--pink-neon); filter:blur(80px); opacity:.2; top:-50px; right:-50px; }
.shortcuts-clássico{ display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:1.5rem; }
.shortcuts-clássico .btn-short{ aspect-ratio:1/1; background:var(--glass); border:1px solid var(--glass-border); border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; font-weight:700; color:#fff; }
{{MODELO_1_END}}

/* === MODELO 2: CARD LATERAL (Tela Cheia) === */
{{MODELO_2_START}}
.hero-lateral{ display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem; background:var(--glass); border-radius:var(--radius); border:1px solid var(--glass-border); padding:1.5rem; aspect-ratio:16/9; align-items:center; }
.hero-lateral .info h2{font-size:2.2rem;font-weight:800;color:var(--pink-neon);line-height:1;margin-bottom:.5rem}
.hero-lateral .info p{color:var(--txt-muted);font-size:.9rem}
.hero-lateral .art{ width:100%; aspect-ratio:1/1; background:var(--bg-app); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:5rem; }
.shortcuts-lateral{ display:flex; gap:1rem; flex-wrap:wrap; }
.shortcuts-lateral .btn-short{ flex:1; min-width:80px; padding:.8rem; background:var(--glass); border:1px solid var(--glass-border); border-radius:14px; text-align:center; font-weight:700; }
{{MODELO_2_END}}

/* === MODELO 3: MINIMALISTA (Clean) === */
{{MODELO_3_START}}
.hero-minimal{ text-align:center; padding:2rem 0; margin-bottom:1rem; }
.hero-minimal h2{font-size:2rem; font-weight:800; color:#fff; }
.hero-minimal h2 span{color:var(--pink-neon);}
.hero-minimal p{color:var(--txt-muted); font-size:.9rem; margin-top:.3rem;}
.shortcuts-minimal{ display:flex; justify-content:space-around; margin:1.5rem 0; gap:.5rem; }
.shortcuts-minimal .btn-short{ flex:1; background:var(--glass); border:1px solid var(--glass-border); border-radius:16px; padding:1rem .5rem; text-align:center; font-weight:600; font-size:.9rem; }
{{MODELO_3_END}}

</style>
</head>
<body>
<div id="app" class="app-shell"></div>

<!-- Player / Overlays (Fixo) -->
<div id="loading" class="loading-overlay" style="position:fixed;inset:0;z-index:9999;display:none;background:rgba(0,0,0,.8);align-items:center;justify-content:center"><div style="width:40px;height:40px;border:4px solid rgba(255,255,255,.1);border-top-color:var(--pink-neon);border-radius:50%;animation:spin .8s linear infinite"></div></div>
<div class="modal fade" id="playerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content glass-modal">
      <div class="modal-header border-0"><div class="player-title fw-bold" id="playerTitle">—</div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body pt-2"><div class="player-wrap"><video id="videoEl" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video></div></div>
    </div>
  </div>
</div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

const store={ get(k,d=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}, del(k){try{localStorage.removeItem(k)}catch{}} };

/* === CONFIGURAÇÃO INJETADA PELO GERADOR === */
const state={
  creds:{ server:'{{server_url}}', user:'{{xtream_user}}', pass:'{{xtream_pass}}' },
  favorites:store.get('favs',{live:[],vod:[],series:[]}),
  history:store.get('hist',{progress:{}}),
  cache:{liveCats:null,liveStreams:null,vodCats:null,vodStreams:null,seriesCats:null,series:null}
};

const api={
  base(){return `${state.creds.server.replace(/\/+$/,'')}/player_api.php?username=${encodeURIComponent(state.creds.user)}&password=${encodeURIComponent(state.creds.pass)}`},
  async call(action='',extra=''){ const url=`${api.base()}${action?`&action=${action}`:''}${extra}`; const r=await fetch(url); return r.json(); },
  streamLive(id){return `${state.creds.server.replace(/\/+$/,'')}/live/${encodeURIComponent(state.creds.user)}/${encodeURIComponent(state.creds.pass)}/${id}.m3u8`},
  streamVod(id){return `${state.creds.server.replace(/\/+$/,'')}/movie/${encodeURIComponent(state.creds.user)}/${encodeURIComponent(state.creds.pass)}/${id}.mp4`}
};

async function loadLive(){ if(state.cache.liveStreams)return; const live=await api.call('get_live_streams'); state.cache.liveStreams=live||[]; }
async function loadVod(){ if(state.cache.vodStreams)return; const vod=await api.call('get_vod_streams'); state.cache.vodStreams=vod||[]; }

function mountApp(){
  $('#app').innerHTML=`
    <header class="app-header">
      <div class="app-title">${state.creds.user}</div>
      <button class="icon-btn" onclick="if(confirm('Sair?')){store.del('creds');location.reload()}"><i class="bi bi-box-arrow-right"></i></button>
    </header>
    <main id="view"></main>
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home"><i class="bi bi-house-heart-fill"></i><span>Início</span></button>
      <button class="nav-item" data-page="live"><i class="bi bi-broadcast"></i><span>Canais</span></button>
      <button class="nav-item" data-page="vod"><i class="bi bi-film"></i><span>Filmes</span></button>
      <button class="nav-item" data-page="fav"><i class="bi bi-heart-fill"></i><span>Favs</span></button>
      <button class="nav-item" data-page="perfil"><i class="bi bi-person"></i><span>Perfil</span></button>
    </nav>`;
  $$('.bottom-nav .nav-item').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
}

function navigate(page){
  $$('.bottom-nav .nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const view=$('#view'); view.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='page'; view.append(wrap);
  ({home:renderHome,live:renderLive,vod:renderVod,profile:renderProfile}[page])(wrap);
}

function renderHome(root){
  /* ====== CONTEÚDO DO MODELO ESCOLHIDO PELO GERADOR ====== */
  root.innerHTML = `{{home_content}}`;
  
  // Eventos dos botões de atalho
  root.querySelectorAll('.btn-short').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.go)));
}

async function renderLive(root){
  await loadLive();
  let html='<div class="ch-row" style="opacity:0.6;padding:10px;text-align:center;justify-content:center">Carregando...</div>';
  if(state.cache.liveStreams.length){ html=''; state.cache.liveStreams.slice(0,50).forEach(s=>{ html+=`
      <div class="ch-row" onclick="playLive('${s.stream_id}','${s.name}')">
        <div class="ch-logo">${s.stream_icon?'<img src="'+s.stream_icon+'" />':'<i class="bi bi-tv"></i>'}</div>
        <div class="ch-info"><div class="n">${s.name}</div></div>
      </div>`; });
  } root.innerHTML=html;
}

async function renderVod(root){
  await loadVod();
  let html='<div class="poster-grid">';
  if(state.cache.vodStreams.length){ state.cache.vodStreams.slice(0,30).forEach(s=>{ html+=`
      <div class="poster" onclick="playVod('${s.stream_id}','${s.name}')">
        <div class="ratio"><img src="${s.stream_icon||''}" /></div>
        <div class="meta"><div class="t">${s.name}</div></div>
      </div>`; });
  } html+='</div>'; root.innerHTML=html;
}

function renderProfile(root){ root.innerHTML=`<div style="background:var(--glass);padding:20px;border-radius:16px"><strong>Conta:</strong> ${state.creds.user}</div>`; }

let player=null;
window.playLive=(id,name)=>{ const url=api.streamLive(id); openPlayer(name,url); };
window.playVod=(id,name)=>{ const url=api.streamVod(id); openPlayer(name,url); };
function openPlayer(title,url){
  if(player){player.dispose();player=null;}
  document.getElementById('playerTitle').textContent=title;
  new bootstrap.Modal('#playerModal').show();
  setTimeout(()=>{
    player=videojs('videoEl',{controls:true,autoplay:true,fluid:true});
    player.src({src:url,type:'application/x-mpegURL'});
  },300);
}

async function boot(){ const data=await api.call(); if(data?.user_info?.auth!==0){ mountApp(); navigate('home'); } }
boot();
</script>
</body>
</html>
